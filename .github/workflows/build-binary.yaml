name: Build Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build binaries
        run: |
          mkdir -p build
          bun build src/main.tsx --compile --target=bun-linux-x64 --outfile build/tfis-linux
          bun build src/main.tsx --compile --target=bun-windows-x64 --outfile build/tfis-win.exe
          bun build src/main.tsx --compile --target=bun-darwin-x64 --outfile build/tfis-macos
          bun build src/main.tsx --compile --target=bun-darwin-arm64 --outfile build/tfis-macos-arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tfis-pathfind-binaries
          path: build/*